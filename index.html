<style>
:root{--bg:#050b1f;--pn:#0b1634;--ln:#16275a;--tx:#eef3ff;--mu:#8fa3d6;--in:#12214d;--ac:#1e6bff;--cy:#3db8ff;--gd:#ffd166;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=l]{--bg:#f2f6ff;--pn:#fff;--ln:#d8e2fa;--tx:#0b1634;--mu:#5b6b94;--in:#e4ecff;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font-size:20px;margin:0;font-weight:800;font-style:italic}h1 b{color:var(--cy)}
.lg{width:30px;height:30px;flex:none}.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.row.sel{background:var(--in);box-shadow:inset 4px 0 0 var(--cy)}.row.sel::after{content:"✓";color:var(--cy);font-weight:700;font-size:20px;margin-left:auto}#selbar{position:fixed;left:0;right:0;top:0;height:56px;z-index:8;display:none;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;background:var(--pn);border-bottom:1px solid var(--ln)}#selbar button{border:0;background:none;color:var(--tx);font:600 15px inherit;font-family:inherit;padding:10px 12px;cursor:pointer}#selbar #sbd{color:#ff5c5c}.nftb{display:inline-block;font-size:10px;font-weight:700;background:linear-gradient(135deg,#1e6bff,#3db8ff);color:#fff;border-radius:6px;padding:1px 6px;margin:2px 0}.adm{height:22px;width:22px;border-radius:6px;vertical-align:-5px;margin-right:5px}.lgs{width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.chip{margin-left:auto;border:1px solid var(--ac);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--gd);font-weight:700;background:none}
.ib{background:none;border:0;color:var(--tx);font-size:20px;cursor:pointer;padding:4px 8px}
main{flex:1;overflow-y:auto}.v{display:none}.v.on{display:block}
.sr{padding:10px 14px}.sr input,.fi{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer;align-items:center}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--ac),var(--cy));color:#fff;overflow:hidden;background-size:cover;background-position:center}
.mt{flex:1;min-width:0}.nm{font-weight:700}.ls{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{font-size:11px;background:var(--in);color:var(--cy);border-radius:6px;padding:1px 6px;margin-left:6px}
.fab{position:absolute;right:18px;bottom:76px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 0 18px var(--ac);cursor:pointer;z-index:3}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:13px 0;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{color:var(--cy);box-shadow:inset 0 2px 0 var(--cy)}
button:focus-visible,.row:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}
.ch{position:absolute;inset:0;display:none;flex-direction:column;z-index:5;background:var(--bg)}.ch.on{display:flex}
.ms{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background-size:cover}
.m{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word}
.i{background:var(--in);color:var(--tx);align-self:flex-start;border-bottom-left-radius:4px}
.o{background:var(--ac);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.g{align-self:center;background:var(--in);border:1px solid var(--gd);color:var(--gd);text-align:center}.po{align-self:stretch;max-width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px}
.rx{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rx button{background:var(--in);color:var(--tx);border:1px solid transparent;border-radius:99px;padding:4px 10px;font-size:14px;cursor:pointer}
.rx button.me{border-color:var(--cy);background:var(--ac);color:#fff}
.cp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ln);background:var(--pn)}
.cp input{flex:1;padding:11px 14px;border-radius:22px;border:0;background:var(--in);color:var(--tx);font:inherit}
.sd{width:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer}
.cd{margin:14px;padding:18px;border:1px solid var(--ac);border-radius:18px;background:var(--pn)}
.cd h2{margin:0 0 6px;font-size:21px}.cd p{margin:0 0 10px;color:var(--mu);line-height:1.45}
.pl{display:flex;justify-content:space-between;padding:13px 14px;margin-top:8px;border:1px solid var(--ln);border-radius:12px;cursor:pointer;background:var(--in)}
.pl.on{border-color:var(--gd);box-shadow:0 0 0 1px var(--gd)}
.bt{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.bt.g{background:var(--in);color:var(--tx)}
.pa{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 14px 6px;gap:6px}
.pa .av{width:92px;height:92px;font-size:34px}
.sw{display:flex;gap:10px;margin-top:8px}.sw i{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}.sw i.on{border-color:var(--tx)}
.lk{opacity:.5}.av.big{width:96px;height:96px;font-size:34px}.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gi{background:var(--in);border-radius:12px;padding:6px;text-align:center;cursor:pointer;font-size:12px;line-height:1.3}.gi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.md{position:absolute;inset:0;background:#0009;display:none;align-items:flex-end;z-index:9}.md.on{display:flex}
.md>div{max-height:88%;overflow-y:auto;width:100%;background:var(--pn);border-radius:20px 20px 0 0;padding:18px 16px 24px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.cp input,.sr input,.fi{color:var(--tx)!important;-webkit-text-fill-color:var(--tx)!important;font-size:16px!important;caret-color:var(--cy)}.cp input{background:var(--in)!important}.cp{gap:6px}.cp input{min-width:0;padding:11px 12px}.sd{flex:none;width:40px;height:40px}.m{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.hn{text-align:center;color:var(--mu);font-size:13px;padding:14px}
body{background:radial-gradient(120% 60% at 50% 0,#0d2260 0,var(--bg) 60%)}:root[data-t=l] body{background:var(--bg)}
header{background:linear-gradient(180deg,var(--pn),var(--bg));box-shadow:0 1px 0 var(--ln),0 6px 18px #0004}.lg{filter:drop-shadow(0 0 6px var(--cy))}
.row{transition:background .15s}.row:active{background:var(--in)}.av{box-shadow:0 0 0 2px var(--pn),0 0 12px #1e6bff55}
.m{box-shadow:0 1px 2px #0003}.m:last-child{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}.ms{background-color:var(--bg)}
nav button.on{background:linear-gradient(180deg,#1e6bff26,transparent)}.fab{background:linear-gradient(135deg,var(--ac),var(--cy));box-shadow:0 6px 22px #1e6bff88}
.md>div{box-shadow:0 -10px 40px #0008}.md>div::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:-8px auto 14px}
.bt{box-shadow:0 4px 14px #1e6bff33;transition:transform .1s}.bt:active{transform:scale(.98)}.bt.g{box-shadow:none}.cd{box-shadow:0 8px 24px #0004}.chip{background:#1e6bff1a}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input:-webkit-autofill{-webkit-text-fill-color:var(--tx)!important;box-shadow:0 0 0 100px var(--in) inset!important}.fi,.sr input{background:var(--in)!important}
input,select{color-scheme:light}.cp input,.sr input,.fi{background:#e4ecff!important;color:#0b1634!important;-webkit-text-fill-color:#0b1634!important;caret-color:#1e6bff;border:1px solid #b9c9f5}.cp input::placeholder,.sr input::placeholder,.fi::placeholder{color:#5b6b94!important;-webkit-text-fill-color:#5b6b94!important;opacity:1}input:-webkit-autofill{-webkit-text-fill-color:#0b1634!important;box-shadow:0 0 0 100px #e4ecff inset!important}
/* --- JoxaGram: realistik ko'rinish va klaviatura --- */
html,body{height:var(--vh,100%)}
body{background:radial-gradient(900px 500px at 50% -8%,#14307a 0%,var(--bg) 62%) fixed}
:root[data-t=l] body{background:radial-gradient(900px 500px at 50% -8%,#dbe8ff 0%,var(--bg) 62%) fixed}
header{background:linear-gradient(180deg,rgba(14,28,66,.94),rgba(11,22,52,.8));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--ln),0 10px 28px rgba(0,0,0,.28)}
:root[data-t=l] header{background:rgba(255,255,255,.88)}
nav{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.row{transition:background .15s}.row:active{background:var(--in)}
.av{box-shadow:0 3px 12px rgba(30,107,255,.4),inset 0 0 0 1px rgba(255,255,255,.18)}
.m{border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.m.o{background:linear-gradient(135deg,var(--ac),#3b8bff);box-shadow:0 3px 10px rgba(30,107,255,.38)}
.fab{box-shadow:0 10px 26px rgba(30,107,255,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.cp{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.cp input{box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.md>div{box-shadow:0 -12px 40px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:no-preference){.m{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}
#jgauth input{margin-bottom:10px}
#inst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:4px;background:linear-gradient(135deg,#1e6bff,#3db8ff);color:#fff;border-radius:99px;box-shadow:0 6px 24px rgba(30,107,255,.5);white-space:nowrap}#inst button{border:0;background:none;color:#fff;font:600 14px inherit;font-family:inherit;padding:11px 8px 11px 16px;cursor:pointer}#inst .x{padding:11px 14px 11px 4px;opacity:.8}.ch.on~#inst,body:has(#md.on) #inst{display:none!important}

.ms{background-image:linear-gradient(rgba(4,9,26,.60),rgba(4,9,26,.60)),var(--wall);background-size:cover;background-position:center;background-color:var(--bg)}
:root[data-t=l] .ms{background-image:linear-gradient(rgba(242,246,255,.80),rgba(242,246,255,.80)),var(--wall)}
.m.i{background:rgba(22,38,88,.95)}:root[data-t=l] .m.i{background:rgba(255,255,255,.97);color:#0b1634}
.m{cursor:pointer}.m.o{border-bottom-right-radius:5px}.m.i{border-bottom-left-radius:5px}
.tk{display:inline-block;font-size:12px;margin-left:5px;letter-spacing:-4px;font-weight:700;opacity:.85}.tk.rd{color:#7fe8ff;opacity:1}
.bdg{width:20px;height:20px;border-radius:6px;vertical-align:-4px;margin-right:5px;object-fit:cover}.bde{margin-right:5px}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px 18px;margin:12px 14px 0;border-radius:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 55%,#0b1634),var(--pn) 78%);border:1px solid var(--ln);box-shadow:0 14px 34px rgba(0,0,0,.35);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--wall) center/cover;opacity:.12;pointer-events:none}
.hero>*{position:relative}.hbtn{position:absolute!important;right:10px;top:8px;font-size:20px}
.havw{position:relative;cursor:pointer;display:block;line-height:0}.havw .av{width:104px;height:104px;font-size:38px}
.cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:16px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.hnm{font-size:22px;font-weight:800;margin-top:10px;text-align:center}.hun{color:var(--mu);font-size:14px}
.hch{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}.hc{border:0;background:rgba(255,255,255,.1);color:var(--tx);border-radius:99px;padding:6px 13px;font:700 13px inherit;font-family:inherit}.hc.pr{background:linear-gradient(135deg,#1e6bff,#3db8ff);color:#fff}button.hc{cursor:pointer}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 14px 0}
.acts button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:16px;padding:12px 4px;font:600 12px inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(0,0,0,.18)}.acts button i{font-style:normal;font-size:22px}
